<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
  <meta name="color-scheme" content="light dark">
  <title>MLP Paint</title>
  <link rel="icon" href="mlp.ico" sizes="any">
  <link rel="stylesheet" href="index.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.77-.78 2.04 0 2.83L5.03 20h7.94l8.88-8.88c.78-.78.78-2.05 0-2.83l-5.29-5.29c-.39-.39-.91-.59-1.42-.59z"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M2.5 4v3h5v12h3V7h5V4h-13zm19 5h-9v3h3v7h3v-7h3V9z"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19 19 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-rectangle" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-triangle" viewBox="0 0 24 24"><path d="M12 4.5 21 19.5H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-fill" viewBox="0 0 24 24"><path d="M16.56 8.94 7.62 0 6.21 1.41l2.38 2.38-5.15 5.15c-.59.59-.59 1.54 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12zM5.21 10 10 5.21 14.79 10H5.21zM19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></symbol>
    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm.5-7H9v2H7v1h2v2h1v-2h2V9h-2z"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM7 9h5v1H7z"/></symbol>
    <symbol id="i-actual-size" viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="12" y="15.2" text-anchor="middle" font-size="8" font-weight="700" font-family="system-ui, sans-serif" fill="currentColor">1:1</text></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M17 4h3c1.1 0 2 .9 2 2v2h-2V6h-3V4zM4 8V6h3V4H4c-1.1 0-2 .9-2 2v2h2zm16 8v2h-3v2h3c1.1 0 2-.9 2-2v-2h-2zM7 18H4v-2H2v2c0 1.1.9 2 2 2h3v-2zM18 8H6v8h12V8z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM8 20H4v-4h4v4zm0-6H4v-4h4v4zm0-6H4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4z"/></symbol>
    <symbol id="i-status-bar" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5v-3h14v3zm0-5H5V5h14v9z"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></symbol>
    <symbol id="i-canvas-fill" viewBox="0 0 24 24"><path d="M19 12h-2v3h-3v2h5v-5zM7 9h3V7H5v5h2V9zm14-6H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.99h18v14.02z"/></symbol>
    <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M12 3v6m0 6v6M3 12h6m6 0h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-selection" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.4"/></symbol>
    <symbol id="i-canvas" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  </svg>

  <header class="app-header">
    <div class="brand"><img class="brand-mark" src="mlp.ico" alt="" width="26" height="26">MLP Paint</div>
    <nav class="ribbon-tabs" role="tablist" aria-label="Ribbon">
      <button class="ribbon-tab" role="tab" id="tab-home" data-tab="home" aria-controls="panel-home" aria-selected="true">Home</button>
      <button class="ribbon-tab" role="tab" id="tab-view" data-tab="view" aria-controls="panel-view" aria-selected="false" tabindex="-1">View</button>
    </nav>
  </header>

  <section class="ribbon" id="panel-home" role="tabpanel" aria-labelledby="tab-home">
    <div class="group">
      <div class="group-body">
        <button class="icon-btn" data-tool="pen" title="Pen (P)" aria-label="Pen"><svg class="icon"><use href="#i-pen"/></svg></button>
        <button class="icon-btn" data-tool="eraser" title="Eraser (E)" aria-label="Eraser"><svg class="icon"><use href="#i-eraser"/></svg></button>
        <button class="icon-btn" data-tool="text" title="Text (T)" aria-label="Text"><svg class="icon"><use href="#i-text"/></svg></button>
      </div>
      <div class="group-title">Tools</div>
    </div>

    <div class="group">
      <div class="group-body shapes">
        <div class="shape-row">
          <button class="icon-btn" data-tool="line" title="Line (L) — hold Shift to snap to 45°" aria-label="Line"><svg class="icon"><use href="#i-line"/></svg></button>
          <button class="icon-btn" data-tool="rectangle" title="Rectangle (R) — hold Shift for a square" aria-label="Rectangle"><svg class="icon"><use href="#i-rectangle"/></svg></button>
          <button class="icon-btn" data-tool="ellipse" title="Ellipse (O) — hold Shift for a circle" aria-label="Ellipse"><svg class="icon"><use href="#i-ellipse"/></svg></button>
          <button class="icon-btn" data-tool="triangle" title="Triangle" aria-label="Triangle"><svg class="icon"><use href="#i-triangle"/></svg></button>
        </div>
        <button class="chip-btn" data-action="toggle-fill" title="Fill shapes with the current color" aria-pressed="false"><svg class="icon"><use href="#i-fill"/></svg>Fill</button>
      </div>
      <div class="group-title">Shapes</div>
    </div>

    <div class="group" id="group-size">
      <div class="group-body stack">
        <div class="size-presets">
          <button class="size-btn" data-size="1" title="1 px" aria-label="1 px"><span></span></button>
          <button class="size-btn" data-size="3" title="3 px" aria-label="3 px"><span></span></button>
          <button class="size-btn" data-size="5" title="5 px" aria-label="5 px"><span></span></button>
          <button class="size-btn" data-size="10" title="10 px" aria-label="10 px"><span></span></button>
          <button class="size-btn" data-size="20" title="20 px" aria-label="20 px"><span></span></button>
        </div>
        <label class="size-slider">
          <input type="range" id="size-range" min="1" max="100" value="3" aria-label="Size in pixels">
          <output id="size-value" for="size-range">3 px</output>
        </label>
      </div>
      <div class="group-title" id="size-title">Size</div>
    </div>

    <div class="group" id="group-text" hidden>
      <div class="group-body stack">
        <div class="text-row">
          <select id="font-family" aria-label="Font">
            <option value="Arial, Helvetica, 'Liberation Sans', sans-serif">Sans-serif</option>
            <option value="Georgia, 'Times New Roman', 'Liberation Serif', serif">Serif</option>
            <option value="'Courier New', 'Liberation Mono', monospace">Monospace</option>
            <option value="'Comic Sans MS', 'Comic Neue', cursive">Comic</option>
            <option value="Impact, 'Arial Black', sans-serif">Impact</option>
          </select>
          <select id="font-size" aria-label="Font size">
            <option>10</option><option>12</option><option>14</option><option>16</option><option>18</option>
            <option>20</option><option selected>24</option><option>28</option><option>32</option><option>40</option>
            <option>48</option><option>64</option><option>72</option><option>96</option><option>128</option>
          </select>
        </div>
        <div class="text-row">
          <button class="icon-btn text-style bold" data-action="toggle-bold" title="Bold" aria-label="Bold" aria-pressed="false">B</button>
          <button class="icon-btn text-style italic" data-action="toggle-italic" title="Italic" aria-label="Italic" aria-pressed="false">I</button>
        </div>
      </div>
      <div class="group-title">Text</div>
    </div>

    <div class="group">
      <div class="group-body">
        <div class="current-color-box">
          <div class="current-color" id="current-color"></div>
          <span>Color</span>
        </div>
        <div class="palette" role="group" aria-label="Palette">
          <button class="swatch" data-color="#000000" title="Black" aria-label="Black"></button>
          <button class="swatch" data-color="#7F7F7F" title="Gray" aria-label="Gray"></button>
          <button class="swatch" data-color="#880015" title="Dark Red" aria-label="Dark Red"></button>
          <button class="swatch" data-color="#ED1C24" title="Red" aria-label="Red"></button>
          <button class="swatch" data-color="#FF7F27" title="Orange" aria-label="Orange"></button>
          <button class="swatch" data-color="#FFF200" title="Yellow" aria-label="Yellow"></button>
          <button class="swatch" data-color="#22B14C" title="Green" aria-label="Green"></button>
          <button class="swatch" data-color="#00A2E8" title="Blue" aria-label="Blue"></button>
          <button class="swatch" data-color="#3F48CC" title="Dark Blue" aria-label="Dark Blue"></button>
          <button class="swatch" data-color="#A349A4" title="Purple" aria-label="Purple"></button>
          <button class="swatch" data-color="#FFFFFF" title="White" aria-label="White"></button>
          <button class="swatch" data-color="#C3C3C3" title="Light Gray" aria-label="Light Gray"></button>
          <button class="swatch" data-color="#B97A57" title="Brown" aria-label="Brown"></button>
          <button class="swatch" data-color="#FFAEC9" title="Pink" aria-label="Pink"></button>
          <button class="swatch" data-color="#FFC90E" title="Gold" aria-label="Gold"></button>
          <button class="swatch" data-color="#EFE4B0" title="Light Yellow" aria-label="Light Yellow"></button>
          <button class="swatch" data-color="#B5E61D" title="Light Green" aria-label="Light Green"></button>
          <button class="swatch" data-color="#99D9EA" title="Light Blue" aria-label="Light Blue"></button>
          <button class="swatch" data-color="#7092BE" title="Medium Blue" aria-label="Medium Blue"></button>
          <button class="swatch" data-color="#C8BFE7" title="Light Purple" aria-label="Light Purple"></button>
        </div>
        <label class="custom-color" title="Pick a custom color">
          <input type="color" id="custom-color" value="#000000" aria-label="Custom color">
          <span>Custom</span>
        </label>
      </div>
      <div class="group-title">Colors</div>
    </div>

    <div class="group">
      <div class="group-body actions">
        <button class="icon-btn" data-action="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="icon"><use href="#i-undo"/></svg></button>
        <button class="icon-btn" data-action="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg class="icon"><use href="#i-redo"/></svg></button>
        <button class="icon-btn" data-action="clear" title="Clear canvas (can be undone)" aria-label="Clear canvas"><svg class="icon"><use href="#i-clear"/></svg></button>
        <button class="icon-btn" data-action="save" title="Save as PNG (Ctrl+S)" aria-label="Save as PNG"><svg class="icon"><use href="#i-save"/></svg></button>
      </div>
      <div class="group-title">Actions</div>
    </div>
  </section>

  <section class="ribbon" id="panel-view" role="tabpanel" aria-labelledby="tab-view" hidden>
    <div class="group">
      <div class="group-body">
        <button class="big-btn" data-action="zoom-in" title="Zoom in (Ctrl +)"><svg class="icon"><use href="#i-zoom-in"/></svg>Zoom in</button>
        <button class="big-btn" data-action="zoom-out" title="Zoom out (Ctrl −)"><svg class="icon"><use href="#i-zoom-out"/></svg>Zoom out</button>
        <button class="big-btn" data-action="zoom-reset" title="Actual size (Ctrl+0)"><svg class="icon"><use href="#i-actual-size"/></svg>100%</button>
        <button class="big-btn" data-action="zoom-fit" title="Zoom so the whole canvas is visible"><svg class="icon"><use href="#i-fit"/></svg>Fit</button>
      </div>
      <div class="group-title">Zoom</div>
    </div>

    <div class="group">
      <div class="group-body">
        <button class="big-btn" data-action="toggle-grid" aria-pressed="false" title="Show gridlines"><svg class="icon"><use href="#i-grid"/></svg>Gridlines</button>
        <button class="big-btn" data-action="toggle-status" aria-pressed="true" title="Show status bar"><svg class="icon"><use href="#i-status-bar"/></svg>Status bar</button>
        <button class="big-btn" data-action="fullscreen" aria-pressed="false" title="Full screen"><svg class="icon"><use href="#i-fullscreen"/></svg>Full screen</button>
      </div>
      <div class="group-title">Show</div>
    </div>

    <div class="group">
      <div class="group-body">
        <form class="canvas-size" id="canvas-size-form">
          <label>W <input type="number" id="canvas-w" min="1" max="8000" required></label>
          <span aria-hidden="true">×</span>
          <label>H <input type="number" id="canvas-h" min="1" max="8000" required></label>
          <button class="chip-btn" type="submit">Apply</button>
        </form>
        <button class="big-btn" data-action="canvas-fill" title="Resize the canvas to fill the window"><svg class="icon"><use href="#i-canvas-fill"/></svg>Fill window</button>
      </div>
      <div class="group-title">Canvas size (px)</div>
    </div>
  </section>

  <main class="workspace" id="workspace">
    <div class="stage">
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div class="grid-layer"></div>
        <canvas id="overlay"></canvas>
        <div class="shape-box" id="shape-box" hidden></div>
        <div class="brush-cursor" id="brush-cursor" hidden></div>
        <textarea class="text-editor" id="text-editor" wrap="off" spellcheck="false" aria-label="Text" hidden></textarea>
        <div class="resize-ghost" id="resize-ghost" hidden></div>
        <div class="size-tip" id="size-tip" hidden></div>
        <div class="resize-handle" data-dir="e" title="Drag to resize the canvas"></div>
        <div class="resize-handle" data-dir="s" title="Drag to resize the canvas"></div>
        <div class="resize-handle" data-dir="se" title="Drag to resize the canvas"></div>
      </div>
    </div>
  </main>

  <footer class="status-bar" id="status-bar">
    <span class="status-item" title="Cursor position"><svg class="icon"><use href="#i-cursor"/></svg><span id="status-pos"></span></span>
    <span class="status-item" title="Shape size"><svg class="icon"><use href="#i-selection"/></svg><span id="status-sel"></span></span>
    <span class="status-item" title="Canvas size"><svg class="icon"><use href="#i-canvas"/></svg><span id="status-canvas"></span></span>
    <span class="status-hint" id="status-hint"></span>
    <span class="status-zoom">
      <span id="zoom-label">100%</span>
      <button class="zoom-step" data-action="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
      <input type="range" id="zoom-slider" min="-3" max="3" step="0.01" value="0" aria-label="Zoom">
      <button class="zoom-step" data-action="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
    </span>
  </footer>
</body>
</html>
